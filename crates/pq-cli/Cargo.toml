[package]
name = "pq-cli"
version = "0.1.0"
edition = "2021"
description = "Deploy, authorise, and benchmark post-quantum Soroban accounts."
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
pq-core = { path = "../pq-core" }
pq-stellar = { path = "../pq-stellar" }
stellar-xdr = { version = "27.0.0", default-features = false, features = ["alloc", "std", "base64"] }
stellar-strkey = "0.0.16"
sha2 = "0.10"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.6"
serde_json = "1"
